<form class="composer-dock" method="post" action="{{ composer_action }}">
  {% csrf_token %}
  {% if composer_hidden %}
    <input type="hidden" name="action" value="{{ composer_hidden }}">
  {% endif %}
  <label class="visually-hidden" for="composer-intent">Ask your analyst</label>
  <div class="composer-shell">
    <textarea
      id="composer-intent"
      name="intent"
      required
      rows="2"
      placeholder="{{ composer_placeholder|default:'Ask your analyst…' }}"
    >{{ draft }}</textarea>
    <button class="composer-send" type="submit">
      <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" focusable="false">
        <path
          d="M8 12.5V3.5M4.5 7 8 3.5 11.5 7"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>
      <span>{{ composer_submit|default:"Send" }}</span>
    </button>
  </div>
</form>
<script>
  (function () {
    var field = document.getElementById("composer-intent");
    if (!field || !field.form) return;
    var form = field.form;
    var sentKey = "kl-sent-message";

    try {
      var sent = sessionStorage.getItem(sentKey);
      sessionStorage.removeItem(sentKey);
      var turns = document.querySelectorAll(".transcript .turn-user");
      var last = turns[turns.length - 1];
      var body = last && last.querySelector("p:last-child");
      var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      if (sent && body && body.textContent.trim() === sent && !reduce) {
        last.classList.add("is-arriving");
        last.scrollIntoView({ block: "end" });
      }
    } catch (error) {}

    field.addEventListener("keydown", function (event) {
      if (event.key !== "Enter" || event.shiftKey) return;
      event.preventDefault();
      form.requestSubmit();
    });

    form.addEventListener("submit", function (event) {
      if (form.dataset.sending === "1") {
        event.preventDefault();
        return;
      }
      var text = field.value.trim();
      if (!text) return;
      if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
      event.preventDefault();
      form.dataset.sending = "1";
      field.readOnly = true;
      try { sessionStorage.setItem(sentKey, text); } catch (error) {}
      form.classList.add("is-sending");
      var slip = document.createElement("p");
      var rect = field.getBoundingClientRect();
      slip.className = "composer-slip";
      slip.setAttribute("aria-hidden", "true");
      slip.textContent = text;
      slip.style.left = rect.left + "px";
      slip.style.top = rect.top + "px";
      slip.style.width = rect.width + "px";
      document.body.appendChild(slip);
      window.setTimeout(function () { form.submit(); }, 420);
    });
  })();
</script>
