<form class="composer-dock" method="post" action="{{ composer_action }}">
  {% csrf_token %}
  {% if composer_hidden %}
    <input type="hidden" name="action" value="{{ composer_hidden }}">
  {% endif %}
  <label class="visually-hidden" for="composer-intent">Ask KryptoLens</label>
  <div class="composer-shell">
    <textarea
      id="composer-intent"
      name="intent"
      required
      rows="2"
      placeholder="{{ composer_placeholder|default:'Ask KryptoLens…' }}"
    >{{ draft }}</textarea>
    <button class="composer-send" type="submit">
      <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" focusable="false">
        <path
          d="M8 12.5V3.5M4.5 7 8 3.5 11.5 7"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>
      <span>{{ composer_submit|default:"Send" }}</span>
    </button>
  </div>
</form>
<script>
  (function () {
    var field = document.getElementById("composer-intent");
    if (!field || !field.form) return;
    field.addEventListener("keydown", function (event) {
      if (event.key !== "Enter" || event.shiftKey) return;
      event.preventDefault();
      field.form.requestSubmit();
    });
  })();
</script>
