{% with form_key=form_class|default:"agent-delete"|slugify %}
<form
  id="delete-{{ form_key }}-{{ agent.id }}"
  method="post"
  action="{% url 'agent_delete' agent.id %}"
  class="{{ form_class|default:'agent-delete' }}"
>
  {% csrf_token %}
  <button
    class="agent-remove{% if labeled %} is-labeled{% endif %}"
    type="button"
    data-delete-open
    aria-label="Delete {{ agent.name }}"
    title="Delete {{ agent.name }}"
  >
    <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" focusable="false">
      <path
        d="M3 4.5h10M6.25 4.5V3.25h3.5V4.5M5.25 4.5v8.25h5.5V4.5M7 7v4M9 7v4"
        fill="none"
        stroke="currentColor"
        stroke-width="1.4"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    </svg>
    {% if labeled %}
      <span>Remove</span>
    {% else %}
      <span class="visually-hidden">Delete</span>
    {% endif %}
  </button>
  <dialog class="delete-dialog" aria-label="Delete {{ agent.name }}">
    <h2>Delete {{ agent.name }}?</h2>
    <p>This removes the analyst and its conversation.</p>
    <div class="actions">
      <button class="btn btn-ghost" type="button" data-delete-cancel>Cancel</button>
      <button class="btn btn-primary" type="submit" form="delete-{{ form_key }}-{{ agent.id }}">Delete</button>
    </div>
  </dialog>
</form>
{% endwith %}
