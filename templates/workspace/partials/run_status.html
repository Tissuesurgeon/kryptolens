{% if run %}
<div
  id="scan-status"
  class="scan-block"
  {% if run.stage != "complete" and run.stage != "error" %}
    hx-get="{% url 'lens_run_status' lens.id run.id %}"
    hx-trigger="every 1s"
    hx-swap="outerHTML"
  {% endif %}
>
  {% if run.stage != "complete" and run.stage != "error" %}
    <p class="visually-hidden">{{ run.stage }}</p>
  {% endif %}
</div>
{% endif %}
