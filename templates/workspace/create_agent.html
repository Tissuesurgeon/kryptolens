{% extends "base.html" %}

{% block title %}Create a Lens · KryptoLens{% endblock %}
{% block workspace_title %}Create a Lens{% endblock %}

{% block content %}
<div class="thread">
  <form method="post" class="form-narrow create-agent">
    {% csrf_token %}
    <h1>Create a Lens</h1>
    <p class="lede">Give it a name. You can tell it what to do after this.</p>
    <p>
      <label for="agent-name">Lens name</label>
      <input id="agent-name" type="text" name="name" required value="{{ name }}" placeholder="Lens name" autocomplete="off">
    </p>
    <div class="actions">
      <a class="btn btn-ghost" href="{% url 'agent_home' %}">Cancel</a>
      <button class="btn btn-primary" type="submit">Create a Lens</button>
    </div>
  </form>
</div>
{% endblock %}
